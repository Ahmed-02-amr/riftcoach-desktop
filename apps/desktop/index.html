<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RiftCoach</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0b1020; color: #edf2ff; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .startup-fallback { min-height: 100vh; display: grid; place-items: center; padding: 32px; }
      .startup-card { max-width: 560px; border: 1px solid #1f2846; background: #10172e; border-radius: 18px; padding: 24px; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
      .startup-card h1 { margin: 0 0 8px; font-size: 24px; }
      .startup-card p { color: #8ea0d2; line-height: 1.55; }
      .startup-card code { color: #c7d2fe; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-fallback">
        <div class="startup-card">
          <h1>Starting RiftCoach…</h1>
          <p>The desktop renderer is loading. If this message stays visible in a packaged build, run <code>pnpm verify:desktop</code> and check the app logs under <code>%APPDATA%\RiftCoach\logs</code>.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
