name: Windows Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - run: pnpm verify:desktop
      - run: pnpm test
      - run: pnpm --filter @riftcoach/desktop dist:win
